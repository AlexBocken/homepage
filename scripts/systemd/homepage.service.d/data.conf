# Drop-in for homepage.service, installed by scripts/deploy.sh to
# /etc/systemd/system/homepage.service.d/data.conf.
#
# The service runs from /usr/share/webapps/homepage/dist as http, and the app
# tree (dist/, node_modules/, static/) is homepage:http and read-only to it —
# and dist/ is wiped by every deploy's rsync --delete anyway. Anything the app
# writes and must keep therefore goes under data/, a sibling of dist/ that deploy
# never syncs over. One subdirectory per feature, so each gets its own
# permissions: data/ itself is root:http 0750 (traverse only).
[Service]
# /finances categorizer store (data/finance/ is http:http 0700); pulled into
# the ledger repo from here.
Environment=FINANCE_OVERRIDES_CSV=/usr/share/webapps/homepage/data/finance/overrides.csv
